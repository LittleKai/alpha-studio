<svg xmlns="http://www.w3.org/2000/svg" width="250" height="184" viewBox="0 0 250 184">
  <title>Alpha Studio Animated Logo</title>
  <defs>
    <!-- Brand colors gradient -->
    <linearGradient id="bodyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#61e8ff" />
      <stop offset="100%" stop-color="#8b7dff" />
    </linearGradient>
    
    <style>
      #logo-body, #logo-accent {
        transform-box: fill-box;
        transform-origin: center;
        opacity: 0;
        transform: scale(0);
      }

      /* Choreographed infinite loops (3000ms period) */
      #logo-body {
        animation: reveal-body-infinite 3000ms cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      }

      #logo-accent {
        animation: reveal-accent-infinite 3000ms cubic-bezier(0.175, 0.885, 0.32, 1.275) infinite;
      }

      /* Keyframes for the main body */
      @keyframes reveal-body-infinite {
        0% {
          opacity: 0;
          transform: scale(0) rotate(-15deg);
        }
        3% {
          opacity: 0;
          transform: scale(0) rotate(-15deg);
        }
        25% {
          opacity: 1;
          transform: scale(1) rotate(0deg);
        }
        85% {
          opacity: 1;
          transform: scale(1) rotate(0deg);
        }
        92% {
          opacity: 0;
          transform: scale(0) rotate(15deg);
        }
        100% {
          opacity: 0;
          transform: scale(0) rotate(15deg);
        }
      }

      /* Keyframes for the accent */
      @keyframes reveal-accent-infinite {
        0% {
          opacity: 0;
          transform: scale(0) translate(20px, -20px);
        }
        10% {
          opacity: 0;
          transform: scale(0) translate(20px, -20px);
        }
        35% {
          opacity: 1;
          transform: scale(1) translate(0, 0);
        }
        85% {
          opacity: 1;
          transform: scale(1) translate(0, 0);
        }
        92% {
          opacity: 0;
          transform: scale(0) translate(20px, -20px);
        }
        100% {
          opacity: 0;
          transform: scale(0) translate(20px, -20px);
        }
      }
    </style>
  </defs>
